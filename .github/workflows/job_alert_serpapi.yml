name: Job Alert Bot - SerpAPI (LinkedIn/Indeed/Glassdoor)

on:
  schedule:
    - cron: '0 */8 * * *'   # every 8 hours (3x/day = ~90 calls/month, safely under SerpAPI's 100/month free limit)
  workflow_dispatch:         # lets you manually trigger a run from the Actions tab

jobs:
  run-serpapi-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome (job_alert.py imports Selenium-dependent code)
        uses: browser-actions/setup-chrome@v1

      - name: Install Python dependencies
        run: pip install requests selenium webdriver-manager

      - name: Run SerpAPI job alert script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python job_alert_serpapi.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "Update seen jobs (SerpAPI) [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
